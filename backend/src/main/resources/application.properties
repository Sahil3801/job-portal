spring.application.name=JobPortal(HireHub)
server.port=${PORT:8080}

#MongoDB
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.uri=${MONGODB_URI}

#JWT (base64 string, at least 64 bytes - generate with: openssl rand -base64 64)
jwt.secret=${JWT_SECRET}

#Email Properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Password reset emails. When BREVO_API_KEY is set, mail goes through Brevo's
#HTTPS API (works on hosts that block SMTP ports); otherwise through SMTP above.
mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
mail.brevo.api-key=${BREVO_API_KEY:}

#Exception Messages
USER_FOUND=An account with this email already exists.
USER_NOT_FOUND=No account found with this email.
INVALID_CREDENTIALS=Incorrect email or password.
INVALID_ACCOUNT_TYPE=Please choose Applicant or Employer.
PROFILE_NOT_FOUND=Profile not found.
ACCESS_DENIED=You are not allowed to do this.

OTP_NOT_FOUND=The code has expired. Please request a new one.
OTP_INCORRECT=The code is incorrect.
OTP_TOO_MANY_ATTEMPTS=Too many wrong attempts. Please request a new code.
EMAIL_FAILED=Could not send the email. Please try again later.

JOB_NOT_FOUND=Job not found.
JOB_NOT_ACTIVE=This job is not accepting applications.
JOB_APPLIED_ALREADY=You have already applied to this job.
APPLICANT_NOT_FOUND=Applicant not found.
OFFER_NOT_PENDING=There is no pending offer to respond to.
